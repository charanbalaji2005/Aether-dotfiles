# AetherOS interface: "aether" — the Quickshell shell (panel, dock, Dynamic
# Island, overview, control centre…). Selected with: aether-interface set aether
# Sourced through ~/.config/aether-shell/hypr/interface.conf, after keybinds.conf.

$shell = qs -c aether-shell ipc call
$fileManager = nautilus

# The shell handles notifications, the panel, launcher, lock screen and power
# menu itself — no separate notification daemon or bar is started. It is
# supervised by systemd (aether-shell.service) for automatic restart on
# crash, with a direct start when there is no systemd user session.
exec-once = systemctl --user start aether-shell.service aether-clipboard.service aether-idle.service 2>/dev/null || qs -c aether-shell

bind = $mod, E, exec, $fileManager #: File manager

# ── AetherOS Shell ──────────────────────────────────────────────────────
bind = $mod, D, exec, $shell launcher toggle
bind = $mod, A, exec, $shell controlcenter toggle
bind = $mod, N, exec, $shell dashboard toggle
bind = $mod, comma, exec, $shell notifications toggle
bind = $mod, V, exec, $shell clipboard toggle
bind = $mod, I, exec, $shell settings toggle
bind = $mod, B, exec, $shell bluetooth toggle
bind = $mod, W, exec, $shell wallpaper toggle
bind = $mod SHIFT, W, exec, aether wallpaper random
bind = $mod CTRL, W, exec, aether wallpaper next
bind = $mod, Escape, exec, $shell powermenu toggle
bind = $mod, L, exec, $shell sessionlock lock

# Overview, dock, system centre, layouts, island (AetherOS 0.3)
bind = $mod, O, exec, $shell overview toggle
bind = $mod SHIFT, O, exec, $shell overview app
bind = $mod, Z, exec, $shell dock toggle
bind = $mod, X, exec, $shell systemcenter toggle
bind = $mod, G, exec, $shell layouts toggle
bind = $mod, U, exec, $shell island toggle
bind = $mod, Y, exec, $shell assistant toggle
bind = $mod SHIFT, Y, exec, $shell widgets edit

# Screenshots (saved to ~/Pictures/Screenshots and copied to the clipboard)
bind = , Print, exec, $shell screenshot full
bind = SHIFT, Print, exec, $shell screenshot region
bind = $mod SHIFT, S, exec, $shell screenshot region

# ── Volume / brightness keys (shell OSD) ───────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && $shell osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && $shell osd brightness
