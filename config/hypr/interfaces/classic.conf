# AetherOS interface: "classic" — Waybar, Rofi, SwayNC, Wlogout, Hyprlock,
# Hypridle, swww, wallust/aether-colors and Pyprland, all driven by AetherOS's
# own scripts (scripts/bin/aether-*). Selected with: aether-interface set classic
# Sourced through ~/.config/aether-shell/hypr/interface.conf, after keybinds.conf.
#
# A trailing "#: text" is what the keybinding reference (Super+H) shows.

$fileManager = thunar
$menu = aether-menu

# Bar, notifications, wallpaper, idle, tray applets, pyprland, clipboard —
# each started once and skipped if missing. Log: $XDG_RUNTIME_DIR/aether-classic-$UID/start.log
exec-once = aether-classic-start

# ── Launcher and menus (Rofi) ───────────────────────────────────────────
bind = $mod, D, exec, $menu apps #: Applications
bind = $mod ALT, D, exec, $menu launchpad #: Launchpad (full-screen app grid)
bind = $mod, R, exec, $menu run #: Run a command
bind = $mod, O, exec, $menu window #: Window switcher
bind = $mod SHIFT, E, exec, $menu files #: Find files
bind = $mod, H, exec, aether-keys #: Keyboard shortcuts (this list)
bind = $mod, V, exec, $menu clipboard #: Clipboard history
bind = $mod, period, exec, $menu emoji #: Emoji picker
bind = $mod ALT, C, exec, $menu calc #: Calculator
bind = $mod, S, exec, $menu web #: Web search
bind = $mod, A, exec, aether-control #: Control Centre
bind = $mod CTRL, A, exec, $menu settings #: Quick settings menu (Rofi)
bind = $mod CTRL, S, exec, aether-settings #: AetherOS Settings window
bind = $mod, I, exec, $menu wifi #: Wi-Fi
bind = $mod, B, exec, $menu bluetooth #: Bluetooth
bind = $mod, M, exec, $menu audio #: Audio devices
bind = $mod, T, exec, $menu theme #: Theme and colours
bind = $mod SHIFT, T, exec, aether-colors mode toggle #: Dark / light
bind = $mod CTRL, L, exec, aether-look #: Looks (bar + launcher + colours + lock screen)
bind = $mod CTRL, P, exec, $menu visual #: Visual profile (effects vs. speed)
bind = $mod CTRL, B, exec, $menu waybar #: Waybar layout and style
bind = $mod ALT, B, exec, aether-waybar toggle #: Hide / show Waybar
bind = ALT, Print, exec, $menu screenshot #: Capture menu

# ── Applications ────────────────────────────────────────────────────────
bind = $mod, E, exec, $fileManager #: File manager
bind = $mod, Y, exec, $terminal -e yazi #: Yazi (terminal file manager)
bind = $mod SHIFT, Escape, exec, $terminal -e btop #: System monitor
bind = $mod, F12, exec, $terminal -e aether-fetch --hold #: System summary (fastfetch)
bind = $mod SHIFT, Return, exec, pypr toggle term #: Drop-down terminal
bind = $mod, Z, exec, pypr zoom #: Zoom in / out
binde = $mod CTRL, equal, exec, aether-zoom in #: Zoom screen in
binde = $mod CTRL, minus, exec, aether-zoom out #: Zoom screen out
bind = $mod CTRL, 0, exec, aether-zoom reset #: Reset screen zoom
bind = $mod SHIFT, C, exec, hyprpicker -a #: Colour picker (copies the hex code)

# ── Notifications ───────────────────────────────────────────────────────
bind = $mod, N, exec, swaync-client -t -sw #: Notification centre
bind = $mod SHIFT, N, exec, aether-toggle dnd #: Do not disturb

# ── Wallpaper ───────────────────────────────────────────────────────────
bind = $mod, W, exec, aether-wall select #: Wallpaper picker
bind = $mod SHIFT, W, exec, aether-wall random #: Random wallpaper
bind = $mod CTRL, W, exec, aether-wall next #: Next wallpaper

# ── Session ─────────────────────────────────────────────────────────────
bind = $mod, Escape, exec, aether-powermenu #: Power menu
bind = CTRL ALT, Delete, exec, aether-powermenu
bind = $mod, L, exec, aether-powermenu run lock #: Lock
bind = $mod SHIFT, G, exec, aether-toggle gamemode #: Game mode (no effects)
bind = $mod ALT, N, exec, aether-toggle nightlight #: Night light
bind = $mod CTRL, R, exec, aether-classic-start --reload #: Reload the desktop

# ── Window groups (tabs) ────────────────────────────────────────────────
bind = $mod, G, togglegroup #: Group / ungroup windows
bind = $mod CTRL, Tab, changegroupactive, f #: Next window in group
bind = $mod CTRL SHIFT, Tab, changegroupactive, b

# ── Screenshots (~/Pictures/Screenshots, also copied) ───────────────────
bind = , Print, exec, aether-shot screen #: Screenshot: whole screen
bind = SHIFT, Print, exec, aether-shot area #: Screenshot: area / window
bind = $mod SHIFT, S, exec, aether-shot area #: Screenshot: area
bind = $mod, Print, exec, aether-shot window #: Screenshot: active window
bind = CTRL, Print, exec, aether-shot screen --delay 5 #: Screenshot in 5 s
bind = $mod SHIFT, A, exec, aether-shot area --edit #: Screenshot and annotate (swappy)

# ── Volume, microphone and brightness keys (with OSD) ───────────────────
bindel = , XF86AudioRaiseVolume, exec, aether-osd volume up #: Volume up
bindel = , XF86AudioLowerVolume, exec, aether-osd volume down #: Volume down
bindl = , XF86AudioMute, exec, aether-osd volume mute #: Mute
bindl = , XF86AudioMicMute, exec, aether-osd mic mute #: Mute microphone
bindel = , XF86MonBrightnessUp, exec, aether-osd brightness up #: Brightness up
bindel = , XF86MonBrightnessDown, exec, aether-osd brightness down #: Brightness down
bindel = , XF86KbdBrightnessUp, exec, aether-osd kbd up
bindel = , XF86KbdBrightnessDown, exec, aether-osd kbd down
