# AetherOS classic — Hypridle. Standalone config for hypridle (its default
# path); never sourced by hyprland.conf. The aether interface uses its own
# generated file instead (aether-idle.service). Keep awake: Super+A → Keep awake.
#
#   2.5 min  dim the backlight (restored on activity)
#   5 min    lock (hyprlock)
#   5.5 min  screens off
#   30 min   suspend — only on battery (aether-powermenu run suspend-on-battery)

general {
    lock_cmd = pidof hyprlock || aether-lock session   # Hyprlock + the unlock animation
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = aether-powermenu run suspend-on-battery
}
