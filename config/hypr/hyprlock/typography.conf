# Lock design "typography": hours over minutes, very large, stacked on the right.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 2
    blur_size = 7
    brightness = 0.6
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $text
    font_size = 220
    font_family = $font ExtraBold
    position = -80, 160
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $accent
    font_size = 220
    font_family = $font ExtraBold
    position = -80, -110
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 80, 80
    halign = left
    valign = bottom
}
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    rounding = 12
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent2
    fade_on_empty = true
    placeholder_text = 󰌾  Password
    font_family = $font
    position = 80, 30
    halign = left
    valign = bottom
}
