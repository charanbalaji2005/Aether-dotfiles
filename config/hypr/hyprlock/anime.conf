# Lock design "anime": a huge split clock (bold hour, light minutes) low on the left, like a film title card.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 1
    blur_size = 7
    brightness = 0.75
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $text
    font_size = 150
    font_family = $font ExtraBold
    position = 80, 210
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $accent
    font_size = 150
    font_family = $font Thin
    position = 380, 210
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $text
    font_size = 22
    font_family = $font
    position = 86, 170
    halign = left
    valign = bottom
}
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 25
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent2
    fade_on_empty = true
    placeholder_text = 󰌾  Password
    font_family = $font
    position = 86, 90
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:30000] aether-lockinfo battery
    color = $subtext
    font_size = 13
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] aether-lockinfo media
    color = $subtext
    font_size = 13
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}
