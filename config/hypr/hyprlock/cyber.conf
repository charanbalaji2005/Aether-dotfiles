# Lock design "cyber": neon accent outlines, monospace readouts in the corners.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.45
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $accent
    font_size = 72
    font_family = $font Bold
    position = 0, 140
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d · %a"
    color = $accent2
    font_size = 16
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:600000] echo "[ $USER@$(hostname) ]"
    color = $subtext
    font_size = 13
    font_family = $font
    position = 30, -30
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:5000] aether-lockinfo layout
    color = $subtext
    font_size = 13
    font_family = $font
    position = -30, -30
    halign = right
    valign = top
}
input-field {
    monitor =
    size = 380, 52
    outline_thickness = 2
    rounding = 0
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent2
    fade_on_empty = false
    placeholder_text = > authenticate_
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] aether-lockinfo battery
    color = $subtext
    font_size = 13
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] aether-lockinfo media
    color = $subtext
    font_size = 13
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}
