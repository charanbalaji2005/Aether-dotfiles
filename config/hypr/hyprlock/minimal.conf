# Lock design "minimal": just the time and a thin password line.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 2
    blur_size = 7
    brightness = 0.5
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 64
    font_family = $font Light
    position = 0, 80
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 260, 40
    outline_thickness = 2
    rounding = 0
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent2
    fade_on_empty = true
    placeholder_text = 
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}
