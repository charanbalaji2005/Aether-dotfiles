# Lock design "island": a "Locked" pill at the top, a large thin clock and date, an avatar circle above the password field, status icons bottom right.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 0
    brightness = 0.9
}
shape {
    monitor =
    size = 140, 34
    color = rgba(000000e6)
    rounding = 17
    position = 0, -16
    halign = center
    valign = top
}
label {
    monitor =
    text = 󰌾  Locked
    color = rgba(ffffffff)
    font_size = 12
    font_family = $font
    position = 0, -23
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 96
    font_family = $font Light
    position = 0, 290
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text
    font_size = 18
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
}
shape {
    monitor =
    size = 104, 104
    color = rgba(ffffff38)
    rounding = -1
    position = 0, -150
    halign = center
    valign = center
}
label {
    monitor =
    text = 󰀄
    color = rgba(ffffffee)
    font_size = 46
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}
label {
    monitor =
    text = Enter password
    color = $text
    font_size = 12
    font_family = $font
    position = 0, -215
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 38
    outline_thickness = 0
    rounding = 18
    dots_size = 0.2
    dots_center = false
    outer_color = $surface
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL</i>
    capslock_color = $accent
    fade_on_empty = false
    placeholder_text =
    font_family = $font
    position = 0, -255
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:10000] aether-lockinfo status
    color = $text
    font_size = 13
    font_family = $font
    position = -28, 24
    halign = right
    valign = bottom
}
