# Lock design "stacked": hours above minutes in big pastel numerals with the seconds between, the date, weather and system lines at the bottom.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 1
    blur_size = 6
    brightness = 0.82
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $accent2
    font_size = 130
    font_family = $font ExtraBold
    position = 0, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = $text
    font_size = 18
    font_family = $font Bold
    position = 0, 95
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $accent
    font_size = 130
    font_family = $font ExtraBold
    position = 0, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text
    font_size = 15
    font_family = $font Italic
    position = 0, -85
    halign = center
    valign = center
}
label {
    monitor =
    text = 󰀄  $USER
    color = $text
    font_size = 13
    font_family = $font
    position = 0, -210
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 260, 40
    outline_thickness = 1
    rounding = 20
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent2
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent
    fade_on_empty = false
    placeholder_text = 󰌾  Type Password
    font_family = $font
    position = 0, -260
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:900000] aether-weather --plain
    color = $subtext
    font_size = 12
    font_family = $font
    position = 24, 60
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:30000] aether-lockinfo battery
    color = $subtext
    font_size = 12
    font_family = $font
    position = 24, 30
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] uptime -p
    color = $subtext
    font_size = 12
    font_family = $font
    position = -24, 30
    halign = right
    valign = bottom
}
