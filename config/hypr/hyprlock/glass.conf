# Lock design "glass": the clock and password inside one frosted panel.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 7
    brightness = 0.65
    vibrancy = 0.2
}
shape {
    monitor =
    size = 440, 340
    color = $surface
    rounding = 28
    border_size = 1
    border_color = $accent
    position = 0, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 84
    font_family = $font Bold
    position = 0, 70
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 17
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 24
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent2
    fade_on_empty = false
    placeholder_text = 󰌾  Password
    font_family = $font
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] aether-lockinfo battery
    color = $subtext
    font_size = 13
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] aether-lockinfo media
    color = $subtext
    font_size = 13
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}
