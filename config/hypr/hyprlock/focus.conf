# Lock design "focus": the wallpaper unblurred, a small date over a large bold clock, avatar, name and a slim password pill near the bottom.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 0
    brightness = 0.85
    vibrancy = 0.1
}
label {
    monitor =
    text = cmd[update:10000] aether-lockinfo media
    color = rgba(ffffffcc)
    font_size = 11
    font_family = $font
    position = 24, -14
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:10000] aether-lockinfo status
    color = rgba(ffffffdd)
    font_size = 12
    font_family = $font
    position = -24, -14
    halign = right
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(ffffffe6)
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    position = 0, 330
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    position = 0, 235
    halign = center
    valign = center
}
shape {
    monitor =
    size = 62, 62
    color = rgba(ffffff33)
    border_size = 1
    border_color = rgba(ffffff55)
    rounding = -1
    position = 0, 150
    halign = center
    valign = bottom
}
label {
    monitor =
    text = 󰀄
    color = rgba(ffffffee)
    font_size = 26
    font_family = $font
    position = 0, 164
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $DESC
    color = rgba(ffffffff)
    font_size = 13
    font_family = $font Bold
    shadow_passes = 1
    position = 0, 118
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 230, 34
    outline_thickness = 1
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ffffff40)
    inner_color = rgba(00000055)
    font_color = rgba(ffffffff)
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL</i>
    capslock_color = $accent
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    font_family = $font
    position = 0, 66
    halign = center
    valign = bottom
}
