# Lock design "signature": centred clock, date, user and password field.
# Selected with: aether-lock design signature

background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.18
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 108
    font_family = $font ExtraBold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = $text
    font_size = 15
    font_family = $font Bold
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 18
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent2
    fade_on_empty = false
    placeholder_text = 󰌾  Password
    hide_input = false
    font_family = $font
    position = 0, -90
    halign = center
    valign = center
}

# Battery, keyboard layout, media (each prints nothing when not applicable)
label {
    monitor =
    text = cmd[update:30000] aether-lockinfo battery
    color = $subtext
    font_size = 13
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:5000] aether-lockinfo layout
    color = $subtext
    font_size = 13
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] aether-lockinfo media
    color = $subtext
    font_size = 13
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
