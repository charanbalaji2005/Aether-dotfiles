# Lock design "retro": an alarm-clock style time with seconds and AM/PM.
background {
    monitor =
    path = $wallpaper
    color = $bg
    blur_passes = 2
    blur_size = 7
    brightness = 0.55
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = $accent
    font_size = 120
    font_family = $font Bold
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%S  %p"
    color = $accent2
    font_size = 26
    font_family = $font Bold
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr a-z A-Z
    color = $text
    font_size = 18
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 8
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $ok
    fail_color = $urgent
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $accent2
    fade_on_empty = true
    placeholder_text = 󰌾  PASSWORD
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] aether-lockinfo battery
    color = $subtext
    font_size = 13
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] aether-lockinfo media
    color = $subtext
    font_size = 13
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}
