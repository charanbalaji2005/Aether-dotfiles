# AetherOS window/layer rules for Hyprland 0.53+ (rewritten rule syntax:
# `match:<property> <value>` selectors, then `<effect> <value>`).
#
# NOT sourced by hyprland.conf directly: compat.conf sources this file or
# the legacy rules.conf, whichever matches the installed Hyprland
# (`aether hyprland compat`, which also runs at every login).
#
# VERIFICATION STATUS: written from Hyprland's documented 0.53 rule syntax
# but not yet parsed by a live 0.53 in AetherOS's test environment.
# `aether hyprland` runs `Hyprland --verify-config`; if it reports an error
# in this file, the legacy file's rules show the intended behaviour.
# Keep the two files in step — tests/hyprland/test_config_syntax.sh checks
# that both cover the same namespaces and window classes.

# ── Layer rules (the shell's glass surfaces) ────────────────────────────
layerrule = match:namespace ^(aether-(bar|launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|osd|island|dock|systemcenter|layouts|assistant|widgets))$, blur on
layerrule = match:namespace ^(aether-(bar|launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|osd|island|dock|systemcenter|layouts|assistant|widgets))$, ignore_alpha 0
layerrule = match:namespace ^(aether-wallpaper)$, no_anim on
layerrule = match:namespace ^(aether-(launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|powermenu|osd|island|dock|overview|systemcenter|layouts|edge|assistant|widgets))$, no_anim on

# ── Window rules ─────────────────────────────────────────────────────────
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(nwg-displays)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:title ^(Open File|Save File|Open Folder|Save As)(.*)$, float on

windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, keep_aspect_ratio on

windowrule = match:class ^(mpv)$, idle_inhibit fullscreen
windowrule = match:class ^(firefox)$, idle_inhibit fullscreen

# ── Classic interface (Waybar, Rofi, SwayNC, Wlogout) ───────────────────
layerrule = match:namespace ^(waybar|rofi|swaync-control-center|swaync-notification-window|logout_dialog|aether-control|aether-calendar|aether-dock)$, blur on
layerrule = match:namespace ^(aether-control|aether-calendar|aether-dock)$, ignore_alpha 0
# Glass (aether-glass) makes every app window translucent and blurred. Video and games stay
# opaque (a see-through film is unwatchable); terminals do their own background translucency
# so their text stays fully sharp.
windowrule = match:class ^(kitty|foot|Alacritty|com\.mitchellh\.ghostty)$, opacity 1.0 override 1.0 override
windowrule = match:class ^(mpv|vlc|org\.gnome\.Totem|io\.github\.celluloid_player\.Celluloid|steam|steam_app_.*|gamescope|obs|com\.obsproject\.Studio|org\.kde\.kdenlive|blender)$, opaque on
layerrule = match:namespace ^(waybar|rofi|swaync-control-center|swaync-notification-window|logout_dialog)$, ignore_alpha 0
layerrule = match:namespace ^(rofi)$, animation popin 92%
layerrule = match:namespace ^(waybar)$, animation slide
layerrule = match:namespace ^(logout_dialog|swaync-control-center)$, animation fade

windowrule = match:class ^(swappy|yad|qalculate-gtk|nwg-look|qt5ct|qt6ct|kvantummanager|org\.gnome\.FileRoller|aether-dropterm)$, float on
windowrule = match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(aether-settings)$, float on
windowrule = match:class ^(aether-keys)$, float on
windowrule = match:class ^(aether-control)$, float on
windowrule = match:class ^(aether-keys)$, size 1180 760
windowrule = match:class ^(aether-keys)$, center on
windowrule = match:class ^(aether-settings)$, size 1100 720
windowrule = match:class ^(swappy|yad|qalculate-gtk|nwg-look|qt5ct|qt6ct|kvantummanager|org\.gnome\.FileRoller|aether-dropterm)$, center on

# ── Workspace rules ──────────────────────────────────────────────────────
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = match:float false, match:workspace w[tv1], border_size 0
windowrule = match:float false, match:workspace w[tv1], rounding 0
windowrule = match:float false, match:workspace f[1], border_size 0
windowrule = match:float false, match:workspace f[1], rounding 0
