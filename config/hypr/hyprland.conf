#
# AetherOS — Hyprland configuration
#

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf

# ── Autostart ────────────────────────────────────────────────────────────
# aether-shell handles notifications, the panel, launcher, lock screen, and
# power menu itself — no separate notification daemon or bar is started.

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Polkit agent (needed for GUI privilege prompts, e.g. package managers, disk tools)
exec-once = hyprpolkitagent

# Clipboard history capture — cliphist only records what wl-paste watches
# and pipes to it. This is handled by the aether-clipboard.service systemd
# user unit (system/systemd/aether-clipboard.service), not started here
# directly, so it restarts automatically if it ever crashes. Enabled by
# scripts/bootstrap.sh; verify with:
#   systemctl --user status aether-clipboard.service

# The shell itself — supervised by systemd (aether-shell.service) for automatic
# restart on crash; falls back to direct execution if systemd user session is absent.
exec-once = systemctl --user start aether-shell.service 2>/dev/null || qs -c aether-shell

# ── General ──────────────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7c9cffee) rgba(b48cffee) 45deg
    col.inactive_border = rgba(2a2e3daa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
}

animations {
    enabled = true

    bezier = aetherEase, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, aetherEase, popin 85%
    animation = windowsOut, 1, 4, aetherEase, popin 85%
    animation = border, 1, 6, aetherEase
    animation = fade, 1, 4, aetherEase
    animation = workspaces, 1, 5, aetherEase, slide
    animation = layers, 1, 4, aetherEase, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    vrr = 1
}

xwayland {
    force_zero_scaling = true
}
