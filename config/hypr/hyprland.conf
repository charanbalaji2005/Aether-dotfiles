#
# AetherOS — Hyprland configuration
#
# Layout (see docs/HYPRLAND_GUIDE.md):
#   config/hypr/*.conf                    shared, version-controlled settings
#   ~/.config/aether-shell/hypr/*.conf    per-machine fragments generated by `aether`:
#       hardware.conf  GPU environment      (aether graphics configure)
#       compat.conf    version-specific syntax (aether hyprland compat)
#       profile.conf   visual/perf profile  (aether performance hyprland <profile>)
#       theme.conf     border colours from the palette (aether theme apply)
#       cursor.conf    cursor theme/size   (aether theme cursor --set …)
#       interface.conf        active interface (aether-interface set classic|aether)
#       interface-theme.conf  classic-interface border colours (aether-colors)
#
# The fragments are created (empty) by scripts/setup-symlinks.sh and
# recreated by `aether repair`, so these `source` lines never point at a
# missing file. If Hyprland ever fails to start, log in on a TTY and run:
#   Hyprland -c ~/.config/hypr/recovery.conf
#

source = ~/.config/hypr/env.conf
source = ~/.config/aether-shell/hypr/hardware.conf
source = ~/.config/aether-shell/hypr/cursor.conf
source = ~/.config/hypr/monitors.conf
# Per-machine displays from Settings → Displays (desc: matching), after monitors.conf.
source = ~/.config/aether-shell/hypr/displays.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/keybinds.conf
# The active interface (classic: Waybar/Rofi/SwayNC… or aether: the Quickshell
# shell): its autostart and keybinds. Written by `aether-interface set …`.
source = ~/.config/aether-shell/hypr/interface.conf
# Window/layer rules are sourced from compat.conf: their syntax changed in
# Hyprland 0.53, so compat.conf picks rules.conf or rules-v2.conf.
source = ~/.config/aether-shell/hypr/compat.conf
# Keyboard/mouse/touchpad and app→workspace rules from Settings.
source = ~/.config/aether-shell/hypr/input.conf
source = ~/.config/aether-shell/hypr/apprules.conf

# ── Autostart ────────────────────────────────────────────────────────────
# Interface-specific autostart (bar, notifications, wallpaper or the
# Quickshell shell) is in config/hypr/interfaces/<interface>.conf.

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Regenerate version-dependent syntax if Hyprland was upgraded since the
# fragment was written (no-op otherwise). Hyprland reloads sourced files
# automatically when they change.
exec-once = aether hyprland compat --if-stale

# Startup applications (XDG autostart, Settings → Startup apps) and, if
# enabled in Settings → Workspaces, the saved session.
exec-once = aether autostart run
exec-once = sleep 3 && aether workspace restore --if-enabled

# Polkit agent (GUI privilege prompts). Fedora ships hyprpolkitagent as a
# systemd user unit and installs the binary in /usr/libexec, not on PATH.
exec-once = systemctl --user start hyprpolkitagent.service 2>/dev/null || /usr/libexec/hyprpolkitagent

# Clipboard history capture — cliphist only records what wl-paste watches
# and pipes to it. This is handled by the aether-clipboard.service systemd
# user unit (system/systemd/aether-clipboard.service), started by the
# interface, so it restarts automatically if it ever crashes. Verify with:
#   systemctl --user status aether-clipboard.service

# ── General ──────────────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7c9cffee) rgba(b48cffee) 45deg
    col.inactive_border = rgba(2a2e3d99)
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 12
    allow_tearing = false
}

decoration {
    rounding = 14

    active_opacity = 1.0
    inactive_opacity = 0.97
    dim_special = 0.25

    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0 4
        color = rgba(0000006b)
        color_inactive = rgba(00000040)
    }

    # Balanced defaults. `aether performance hyprland quality|low-latency|battery`
    # overrides these via profile.conf (sourced at the end of this file).
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
        noise = 0.015
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.12
    }
}

animations {
    enabled = true

    # Expressive deceleration for things appearing, a quicker curve for
    # things leaving, and a near-linear curve for continuous motion.
    bezier = aetherEase, 0.16, 1, 0.3, 1
    bezier = aetherOut, 0.3, 0, 0.8, 0.15
    bezier = aetherMove, 0.25, 0.9, 0.3, 1
    bezier = aetherLinear, 0, 0, 1, 1

    animation = windowsIn, 1, 4, aetherEase, popin 88%
    animation = windowsOut, 1, 3, aetherOut, popin 90%
    animation = windowsMove, 1, 4, aetherMove, slide
    animation = layersIn, 1, 3, aetherEase, fade
    animation = layersOut, 1, 2, aetherOut, fade
    animation = fadeIn, 1, 3, aetherEase
    animation = fadeOut, 1, 2, aetherOut
    animation = fadeSwitch, 1, 3, aetherEase
    animation = fadeDim, 1, 3, aetherEase
    animation = fadeLayersIn, 1, 3, aetherEase
    animation = fadeLayersOut, 1, 2, aetherOut
    animation = border, 1, 6, aetherEase
    animation = workspaces, 1, 5, aetherEase, slidefade 12%
    animation = specialWorkspace, 1, 4, aetherEase, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Touchpad workspace gestures live in compat.conf: their syntax changed in
# Hyprland 0.51, so they are written for the installed version.

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # Variable refresh: don't redraw unchanged frames (big idle power saving).
    vfr = true
    vrr = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    mouse_move_enables_dpms = true
    # If the shell crashes while the screen is locked, the session stays
    # locked and the restarted shell may take the lock back (it re-locks
    # itself on start-up). Trade-off: any client of *this user* could also
    # take over a dead lock; such a client could already control the
    # session. See RECOVERY.md.
    allow_session_lock_restore = true
    key_press_enables_dpms = true
}

binds {
    workspace_back_and_forth = false
    allow_workspace_cycles = true
}

xwayland {
    force_zero_scaling = true
}

# Palette-driven border colours (overrides general:col.* above).
source = ~/.config/aether-shell/hypr/theme.conf
# Classic interface: colours from aether-colors (wallpaper/preset palette).
source = ~/.config/aether-shell/hypr/interface-theme.conf
# Classic interface: gaps, borders and rounding of the chosen look (aether-look).
source = ~/.config/aether-shell/hypr/look.conf
# Frosted glass: blur strength and window translucency (aether-glass, default acrylic).
source = ~/.config/aether-shell/hypr/glass.conf

# Must stay last: the selected performance profile overrides the defaults above.
source = ~/.config/aether-shell/hypr/profile.conf
