$mod = SUPER
$terminal = aether-terminal

# Keybinds shared by both AetherOS interfaces. Interface-specific keys
# (launcher, menus, notifications, screenshots, volume/brightness OSD, file
# manager) live in interfaces/classic.conf and interfaces/aether.conf; the
# active one is sourced by ~/.config/aether-shell/hypr/interface.conf
# (aether-interface set classic|aether).
#
# A trailing "#: text" is the description shown by the keybinding
# reference (Super+H in the classic interface). Full list: docs/KEYBINDS.md

# ── Applications ─────────────────────────────────────────────────────────
bind = $mod, Return, exec, $terminal #: Terminal
bind = $mod ALT, Return, exec, $terminal --pick-shell #: Terminal with a chosen shell (zsh, bash, tmux, meridian)
bind = $mod SHIFT, D, exec, $terminal -e bash -lc 'code .' #: VS Code in a terminal's directory

# ── Window management ───────────────────────────────────────────────────
bind = $mod, Q, killactive #: Close window
bind = $mod SHIFT, Q, exit #: Exit Hyprland
bind = $mod, F, fullscreen #: Fullscreen
bind = $mod SHIFT, F, fullscreen, 1 #: Maximise
bind = $mod, Space, togglefloating #: Float / tile window
bind = $mod, C, centerwindow #: Centre floating window
bind = $mod, P, pseudo #: Pseudo-tile
bind = $mod, J, togglesplit #: Swap split direction
bind = $mod, Tab, workspace, previous #: Previous workspace

# Focus movement
bind = $mod, left, movefocus, l #: Focus left
bind = $mod, right, movefocus, r #: Focus right
bind = $mod, up, movefocus, u #: Focus up
bind = $mod, down, movefocus, d #: Focus down
bind = ALT, Tab, cyclenext #: Cycle windows
bind = ALT, Tab, bringactivetotop

# Window movement within a workspace
bind = $mod SHIFT, left, movewindow, l #: Move window left
bind = $mod SHIFT, right, movewindow, r #: Move window right
bind = $mod SHIFT, up, movewindow, u #: Move window up
bind = $mod SHIFT, down, movewindow, d #: Move window down

# Keyboard resize (hold to repeat)
binde = $mod CTRL SHIFT, left, resizeactive, -40 0 #: Resize (hold)
binde = $mod CTRL SHIFT, right, resizeactive, 40 0
binde = $mod CTRL SHIFT, up, resizeactive, 0 -40
binde = $mod CTRL SHIFT, down, resizeactive, 0 40

# Mouse-driven move/resize
bindm = $mod, mouse:272, movewindow #: Drag window
bindm = $mod, mouse:273, resizewindow #: Drag to resize

# ── Workspaces ───────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1 #: Workspace 1–10 (keys 1…0)
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1 #: Send window to workspace 1–10
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod CTRL, right, workspace, e+1 #: Next workspace
bind = $mod CTRL, left, workspace, e-1 #: Previous workspace (by number)

# Scratchpad (special workspace)
bind = $mod, grave, togglespecialworkspace, scratch #: Scratchpad
bind = $mod SHIFT, grave, movetoworkspace, special:scratch #: Send window to scratchpad

# ── Multi-monitor ────────────────────────────────────────────────────────
bind = $mod ALT, left, focusmonitor, l #: Focus monitor left
bind = $mod ALT, right, focusmonitor, r #: Focus monitor right
bind = $mod ALT SHIFT, left, movecurrentworkspacetomonitor, l #: Move workspace to left monitor
bind = $mod ALT SHIFT, right, movecurrentworkspacetomonitor, r #: Move workspace to right monitor

# ── Screen recording (wf-recorder). Press again to stop; saved to ~/Videos/Recordings.
bind = $mod SHIFT, R, exec, aether-record toggle full #: Record screen (start/stop)
bind = $mod ALT, R, exec, aether-record toggle region #: Record area (start/stop)


# ── Media keys (volume and brightness keys are per interface: they show an OSD) ──
bindl = , XF86AudioPlay, exec, playerctl play-pause #: Play / pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next #: Next track
bindl = , XF86AudioPrev, exec, playerctl previous #: Previous track
bindl = , XF86AudioStop, exec, playerctl stop
