$mod = SUPER
$terminal = kitty
$fileManager = nautilus
$shell = qs -c aether-shell ipc call

# Full list with descriptions: docs/KEYBINDS.md

# ── AetherOS Shell ──────────────────────────────────────────────────────
bind = $mod, D, exec, $shell launcher toggle
bind = $mod, A, exec, $shell controlcenter toggle
bind = $mod, N, exec, $shell dashboard toggle
bind = $mod, comma, exec, $shell notifications toggle
bind = $mod, V, exec, $shell clipboard toggle
bind = $mod, I, exec, $shell settings toggle
bind = $mod, B, exec, $shell bluetooth toggle
bind = $mod, W, exec, $shell wallpaper toggle
bind = $mod SHIFT, W, exec, aether wallpaper random
bind = $mod CTRL, W, exec, aether wallpaper next
bind = $mod, Escape, exec, $shell powermenu toggle
bind = $mod, L, exec, $shell sessionlock lock

# Screenshots (saved to ~/Pictures/Screenshots and copied to the clipboard)
bind = , Print, exec, $shell screenshot full
bind = SHIFT, Print, exec, $shell screenshot region
bind = $mod SHIFT, S, exec, $shell screenshot region

# ── Applications ─────────────────────────────────────────────────────────
bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod SHIFT, D, exec, $terminal -e bash -lc 'code . || true'

# ── Window management ───────────────────────────────────────────────────
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, F, fullscreen
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, Space, togglefloating
bind = $mod, C, centerwindow
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, Tab, workspace, previous

# Focus movement
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

# Window movement within a workspace
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Keyboard resize (hold to repeat)
binde = $mod CTRL SHIFT, left, resizeactive, -40 0
binde = $mod CTRL SHIFT, right, resizeactive, 40 0
binde = $mod CTRL SHIFT, up, resizeactive, 0 -40
binde = $mod CTRL SHIFT, down, resizeactive, 0 40

# Mouse-driven move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Workspaces ───────────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod CTRL, right, workspace, e+1
bind = $mod CTRL, left, workspace, e-1

# Scratchpad (special workspace)
bind = $mod, grave, togglespecialworkspace, scratch
bind = $mod SHIFT, grave, movetoworkspace, special:scratch

# ── Multi-monitor ────────────────────────────────────────────────────────
bind = $mod ALT, left, focusmonitor, l
bind = $mod ALT, right, focusmonitor, r
bind = $mod ALT SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mod ALT SHIFT, right, movecurrentworkspacetomonitor, r

# ── Media / volume / brightness keys ────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && $shell osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && $shell osd brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
