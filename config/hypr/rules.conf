# ── Layer rules (the shell's glass surfaces) ────────────────────────────
# QML can't blur behind its own window; the frosted-glass look comes from
# the compositor. Every aether-shell surface sets an explicit layer-shell
# namespace (WlrLayershell.namespace in the QML), so these rules match
# deterministically instead of guessing Quickshell's default namespace.
# Check with `hyprctl layers` while the shell runs.
#
# Blur on: bar, launcher, control center, dashboard, notification center,
# toasts, settings, clipboard, bluetooth manager, wallpaper picker, OSD.
# Blur off: the wallpaper layer (nothing behind it) and the power menu
# overlay (full-screen dim — blurring the whole screen is expensive).
layerrule = blur, ^(aether-(bar|launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|osd))$
layerrule = ignorezero, ^(aether-(bar|launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|osd))$
layerrule = noanim, ^(aether-wallpaper)$
# Shell surfaces animate themselves (with reduced-motion support), so the
# compositor's own layer animation would double up.
layerrule = noanim, ^(aether-(launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|powermenu|osd))$

# ── Window rules ─────────────────────────────────────────────────────────
# Float commonly-floating utility windows
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(nwg-displays)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, class:^(xdg-desktop-portal-gtk)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, title:^(Open File|Save File|Open Folder|Save As)(.*)$

# Picture-in-picture: keep on top, pin to all workspaces
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = keepaspectratio, title:^(Picture-in-Picture)$

# Idle inhibit while a video call or media player is fullscreen
windowrule = idleinhibit fullscreen, class:^(mpv)$
windowrule = idleinhibit fullscreen, class:^(firefox)$

# ── Workspace rules ──────────────────────────────────────────────────────
# Smart gaps: a lone tiled window gets no outer gap or border.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]
