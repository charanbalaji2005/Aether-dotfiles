# Legacy rule syntax (Hyprland < 0.53). NOT sourced by hyprland.conf
# directly: compat.conf sources this file or rules-v2.conf, whichever
# matches the installed Hyprland (`aether hyprland compat`).
#
# ── Layer rules (the shell's glass surfaces) ────────────────────────────
# QML can't blur behind its own window; the frosted-glass look comes from
# the compositor. Every aether-shell surface sets an explicit layer-shell
# namespace (WlrLayershell.namespace in the QML), so these rules match
# deterministically instead of guessing Quickshell's default namespace.
# Check with `hyprctl layers` while the shell runs.
#
# Blur on: bar, launcher, control center, dashboard, notification center,
# toasts, settings, clipboard, bluetooth manager, wallpaper picker, OSD.
# Also: island, dock, system centre, layout picker.
# Blur off: the wallpaper layer (nothing behind it), and the full-screen
# overlays (power menu, overview — blurring the whole screen is expensive).
layerrule = blur, ^(aether-(bar|launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|osd|island|dock|systemcenter|layouts|assistant|widgets))$
layerrule = ignorezero, ^(aether-(bar|launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|osd|island|dock|systemcenter|layouts|assistant|widgets))$
layerrule = noanim, ^(aether-wallpaper)$
# Shell surfaces animate themselves (with reduced-motion support), so the
# compositor's own layer animation would double up.
layerrule = noanim, ^(aether-(launcher|controlcenter|dashboard|notifications|toasts|settings|clipboard|bluetooth|wallpicker|powermenu|osd|island|dock|overview|systemcenter|layouts|edge|assistant|widgets))$

# ── Window rules ─────────────────────────────────────────────────────────
# Float commonly-floating utility windows
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(nwg-displays)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, class:^(xdg-desktop-portal-gtk)$
windowrule = float, class:^(org.gnome.Calculator)$
windowrule = float, title:^(Open File|Save File|Open Folder|Save As)(.*)$

# Picture-in-picture: keep on top, pin to all workspaces
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = keepaspectratio, title:^(Picture-in-Picture)$

# Idle inhibit while a video call or media player is fullscreen
windowrule = idleinhibit fullscreen, class:^(mpv)$
windowrule = idleinhibit fullscreen, class:^(firefox)$

# ── Classic interface (Waybar, Rofi, SwayNC, Wlogout) ───────────────────
# Blur behind the translucent surfaces; Rofi and wlogout fade instead of sliding.
layerrule = blur, ^(waybar|rofi|swaync-control-center|swaync-notification-window|logout_dialog|aether-control|aether-calendar|aether-dock)$
layerrule = ignorezero, ^(aether-control|aether-calendar|aether-dock)$
# Glass (aether-glass) makes every app window translucent and blurred. Video and games stay
# opaque (a see-through film is unwatchable); terminals do their own background translucency
# so their text stays fully sharp.
windowrule = opacity 1.0 override 1.0 override, class:^(kitty|foot|Alacritty|com\.mitchellh\.ghostty)$
windowrule = opaque, class:^(mpv|vlc|org\.gnome\.Totem|io\.github\.celluloid_player\.Celluloid|steam|steam_app_.*|gamescope|obs|com\.obsproject\.Studio|org\.kde\.kdenlive|blender)$
layerrule = ignorezero, ^(waybar|rofi|swaync-control-center|swaync-notification-window|logout_dialog)$
layerrule = animation popin 92%, ^(rofi)$
layerrule = animation slide, ^(waybar)$
layerrule = animation fade, ^(logout_dialog|swaync-control-center)$

windowrule = float, class:^(swappy|yad|qalculate-gtk|nwg-look|qt5ct|qt6ct|kvantummanager|org\.gnome\.FileRoller|aether-dropterm)$
windowrule = float, title:^(File Operation Progress)$
windowrule = float, class:^(aether-settings)$
windowrule = float, class:^(aether-keys)$
windowrule = float, class:^(aether-control)$
windowrule = move 100%-460 46, class:^(aether-control)$
windowrule = size 1180 760, class:^(aether-keys)$
windowrule = center, class:^(aether-keys)$
windowrule = size 1100 720, class:^(aether-settings)$
windowrule = center, class:^(swappy|yad|qalculate-gtk|nwg-look|qt5ct|qt6ct|kvantummanager|org\.gnome\.FileRoller|aether-dropterm)$

# ── Workspace rules ──────────────────────────────────────────────────────
# Smart gaps: a lone tiled window gets no outer gap or border.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]
