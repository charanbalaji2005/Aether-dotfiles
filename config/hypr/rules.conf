# ── Layer rules (for the shell's glass panels) ──────────────────────────
# aether-shell's "glass" look (theme/GlassPanel.qml, the bar, launcher,
# dashboard, etc.) only gets real backdrop blur from the compositor — QML
# can't blur behind its own window. Run `hyprctl layers` while the shell is
# running to confirm the exact namespace Quickshell registers (it's
# typically "quickshell:<config-name>", i.e. "quickshell:aether-shell"
# here) and adjust the regex below if it doesn't match on your Quickshell
# version.
layerrule = blur, ^(quickshell:aether-shell)$
layerrule = ignorezero, ^(quickshell:aether-shell)$

# ── Window rules ─────────────────────────────────────────────────────────
# Float commonly-floating utility windows
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, class:^(xdg-desktop-portal-gtk)$

# Picture-in-picture: keep on top, pin to all workspaces
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = keepaspectratio, title:^(Picture-in-Picture)$

# Idle inhibit while a video call or media player is fullscreen
windowrule = idleinhibit fullscreen, class:^(mpv)$
