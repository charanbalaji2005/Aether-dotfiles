# Monitor configuration.
# Default: let Hyprland auto-detect resolution/refresh rate and place every
# connected monitor at its preferred mode. This just works on a single
# monitor; for multi-monitor setups, replace with explicit lines.
#
# Syntax: monitor = name, resolution, position, scale
# Find monitor names with: hyprctl monitors

monitor = , preferred, auto, 1

# Example explicit multi-monitor setup (edit to match your hardware, then
# remove the catch-all line above):
#
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
