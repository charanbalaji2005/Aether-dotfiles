# Environment variables for AetherOS's Hyprland session.
# Sourced from hyprland.conf via `source = ~/.config/hypr/env.conf`

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Toolkit backends: force Wayland-native rendering so Qt/GTK/Electron apps
# don't fall back to XWayland scaling/blur oddities.
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1

# Cursor
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

# Electron/Chromium apps (VS Code, Discord, etc.) need this flag passed at
# launch to use native Wayland windowing; most apps read this env var
# automatically if they support the --ozone-platform=wayland flag pattern.
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
