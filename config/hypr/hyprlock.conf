# AetherOS classic — Hyprlock (lock screen). Standalone config for hyprlock;
# never sourced by hyprland.conf. Colours and $wallpaper come from aether-colors.
# Try it safely from a terminal: hyprlock --immediate   (unlock with your password)

source = ~/.config/aether-shell/classic/colors/hyprlock.conf
$font = JetBrainsMono Nerd Font
# The chosen design (config/hypr/hyprlock/<name>.conf), copied here by
# aether-colors so this file always parses: aether-lock design NAME
source = ~/.config/aether-shell/classic/colors/hyprlock-design.conf


# Only long-standing options are used so the file parses on every hyprlock
# Fedora 41+ ships.
general {
    hide_cursor = true
    ignore_empty_input = true
}

# Lock fades in; on the right password it dissolves into the desktop while
# aether-lock zooms the desktop in and lets it settle (see `aether-lock session`).
animations {
    enabled = true
    bezier = aetherEase, 0.16, 1, 0.3, 1
    bezier = aetherOut, 0.3, 0, 0.8, 0.15
    # Ease-in-out: the dissolve starts softly and settles softly.
    bezier = aetherSmooth, 0.45, 0, 0.2, 1
    animation = fadeIn, 1, 6, aetherSmooth
    animation = fadeOut, 1, 8, aetherSmooth
    animation = inputFieldDots, 1, 3, aetherSmooth
    animation = inputFieldWidth, 1, 4, aetherSmooth
    animation = inputFieldColors, 1, 5, aetherSmooth
}

# Dynamic Island: the playing track as a black capsule at the top centre.
# The lock screen cannot host the live (Quickshell) island, so
# ~/.config/waybar/scripts/lock-island.sh renders it as a picture and this
# reloads it every 2 s; with nothing playing it is a transparent pixel.
image {
    monitor =
    path = ~/.cache/aether/island/lock-empty.png
    reload_time = 2
    reload_cmd = ~/.config/waybar/scripts/lock-island.sh
    size = 64
    rounding = 0
    border_size = 0
    position = 0, -14
    halign = center
    valign = top
}
