# AetherOS — Hyprland RECOVERY configuration.
#
# Deliberately NOT sourced by hyprland.conf. Use it when the normal session
# won't start (bad GPU fragment, config error after a Hyprland upgrade):
#
#   1. Switch to a TTY: Ctrl+Alt+F3, log in
#   2. Hyprland -c ~/.config/hypr/recovery.conf
#   3. In the terminal that opens:  aether diagnostics   then   aether repair
#
# It sources nothing else, starts no shell, sets no GPU environment, and
# uses no blur, shadows or animations — the minimum that renders on any GPU.

monitor = , preferred, auto, 1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(f87171ff)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
}

exec-once = kitty || foot || alacritty || xterm

bind = SUPER, Return, exec, kitty || foot || alacritty || xterm
bind = SUPER, Q, killactive
bind = SUPER SHIFT, Q, exit
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
