# AetherOS tmux — linked to ~/.config/tmux/tmux.conf by setup-symlinks.sh.
# Open it with Super+Alt+Return → tmux, or make it the default shell there.
# Prefix is Ctrl+B (tmux's default). Reload this file: prefix, r.

# ── shell and terminal ──────────────────────────────────────────────────
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB,foot:RGB,alacritty:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g allow-passthrough on          # kitty images / meridian pic inside tmux
set -g set-titles on
set -g set-titles-string "#S · #W"

# ── behaviour ───────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g detach-on-destroy off         # closing a session moves to another, not out

# ── keys (prefix, then …) ───────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
# Alt+1…9 jumps to a window without the prefix.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ── look: one quiet line at the bottom, terminal colours only ───────────
set -g status-position bottom
set -g status-interval 15
set -g status-style "bg=default,fg=colour8"
set -g status-left "#[fg=colour4,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour8]%a %d %b  %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour0,bg=colour4,bold] #I #W #[default]"
setw -g window-status-separator ""
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=default,fg=colour4"
setw -g mode-style "bg=colour4,fg=colour0"
