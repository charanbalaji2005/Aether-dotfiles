# AetherOS kitty config.
# Colors are the same tokens as config/quickshell/aether-shell/theme/Colors.qml,
# translated to kitty's palette — keep the two in sync if you change the theme.

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 12
confirm_os_window_close 0

background_opacity 0.88
dynamic_background_opacity yes

cursor_shape beam
cursor_blink_interval 0.6
cursor_trail 1

scrollback_lines 10000

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# ── AetherOS palette ─────────────────────────────────────────────────────
background            #0A0C12
foreground             #EDEFF7
cursor                 #7C9CFF
selection_background   #7C9CFF
selection_foreground   #0A0C12

color0  #1B1E29
color8  #7E8399

color1  #F87171
color9  #FF8A8A

color2  #4ADE80
color10 #6EE7A0

color3  #FBBF24
color11 #FFD166

color4  #7C9CFF
color12 #9CB4FF

color5  #B48CFF
color13 #CBA8FF

color6  #38BDF8
color14 #6FD3FF

color7  #AEB3C7
color15 #EDEFF7

active_border_color   #7C9CFF
inactive_border_color #2A2E3D

allow_remote_control yes
enabled_layouts tall,fat,grid,splits,stack
