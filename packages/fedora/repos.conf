# Third-party COPR repositories for packages Fedora itself may not ship.
# Format:  package|owner/project|why
#
# install.sh consults this ONLY when a package is not available from the
# repositories you already have enabled, and asks before enabling anything
# (or needs --enable-copr). COPR projects are community-maintained and can
# be renamed or abandoned: check the project page shown at the prompt
# before saying yes. If Fedora ships the package, this file is never used.
hyprland|solopasha/hyprland|Hyprland and its companion tools
xdg-desktop-portal-hyprland|solopasha/hyprland|Hyprland portal backend
hyprpolkitagent|solopasha/hyprland|Polkit authentication agent
hypridle|solopasha/hyprland|Idle daemon (auto-lock, display off)
hyprsunset|solopasha/hyprland|Night light
cliphist|solopasha/hyprland|Clipboard history
quickshell|errornointernet/quickshell|Quickshell, when Fedora doesn't package it
hyprlock|solopasha/hyprland|Hyprland's screen locker
hyprpicker|solopasha/hyprland|Colour picker
yazi|lihaohong/yazi|Terminal file manager
