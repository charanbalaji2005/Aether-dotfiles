# Third-party COPR repositories for packages Fedora itself doesn't ship.
# Format:  package|owner/project|why
#
# install.sh consults this ONLY when a package is not available from the
# repositories you already have enabled, and enables a COPR only after a yes
# (the onboarding asks once, listing them; --enable-copr or --auto agree in
# advance). If Fedora ships the package, this file is never used.
#
# Fedora 44 ships no Hyprland at all: sdegler/hyprland provides the whole
# stack (verified 2026-11-14: hyprland 0.57.x and everything below).
# https://copr.fedorainfracloud.org/coprs/sdegler/hyprland/
hyprland|sdegler/hyprland|Hyprland, the compositor
xdg-desktop-portal-hyprland|sdegler/hyprland|Hyprland portal backend (screen sharing, file pickers)
hyprpolkitagent|sdegler/hyprland|Polkit authentication agent
hypridle|sdegler/hyprland|Idle daemon (auto-lock, display off)
hyprlock|sdegler/hyprland|Hyprland's screen locker
hyprsunset|sdegler/hyprland|Night light
hyprpicker|sdegler/hyprland|Colour picker
hyprpaper|sdegler/hyprland|Wallpaper daemon (Quickshell interface)
swww|sdegler/hyprland|Animated wallpaper daemon
nwg-look|sdegler/hyprland|GTK settings editor
cliphist|sdegler/hyprland|Clipboard history (Fedora ships it too)
quickshell|errornointernet/quickshell|Quickshell, when Fedora doesn't package it
yazi|lihaohong/yazi|Terminal file manager
