# AetherOS — swaync is D-Bus-activated through swaync.service whenever a
# notification arrives first, so the unit itself must load the AetherOS
# config and the colour wrapper (generated by aether-colors) instead of a
# bare style.css that has no colour definitions.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'style=%h/.config/aether-shell/classic/swaync/style.css; [ -f "$$style" ] || style=%h/.config/swaync/style.css; exec swaync -c %h/.config/swaync/config.json -s "$$style"'
