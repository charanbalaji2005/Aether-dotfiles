name: Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hyprland-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hyprland config syntax/wiring check
        run: bash tests/hyprland/test_config_syntax.sh

  qml-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: QML brace/paren/import structural check
        run: bash tests/shell/test_qml_structure.sh

  python-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: aether CLI unit tests (hardware/graphics/telemetry fixtures)
        run: bash tests/python/run_python_tests.sh

  qml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt's qmllint (via PySide6)
        run: pip install PySide6-Essentials
      - name: QML syntax check
        run: QMLLINT=pyside6-qmllint bash tests/shell/test_qml_lint.sh

  config-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd units, package lists, JSON, config schema, IPC targets
        run: bash tests/config/test_config_files.sh

  install-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Symlink / backup / restore / uninstall integration test
        run: bash tests/integration/test_symlink_lifecycle.sh
      - name: install.sh --check/--dry-run/--install/--rollback in a fake HOME (non-root runner)
        run: bash tests/integration/test_installer.sh

  generated-files:
    # Schema data and the CLI reference are generated from the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen_schema.py --check
      - run: python3 tools/gen_cli_reference.py --check
      - run: python3 tests/shell/qml_imports.py config/quickshell/aether-shell

  security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock-screen unlock path, constant shell scripts, allowlisted actions
        run: bash tests/shell/test_security_invariants.sh

  qml-runtime:
    # Springs, shaders, wallpaper transitions and components rendered for
    # real (Qt Quick, OpenGL RHI on Mesa llvmpipe under Xvfb) with pixel checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt (PySide6), Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
          pip install PySide6-Essentials PySide6-Addons
      - name: Runtime QML tests
        run: bash tests/shell/runtime/run_runtime_tests.sh

  shaders-up-to-date:
    # The bundled .qsb files must be rebuilt whenever a .frag changes. Built
    # with Qt 6.7's qsb for compatibility with Fedora 41+ (Qt >= 6.8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "PySide6-Essentials==6.7.3" "PySide6-Addons==6.7.3"
      - name: Rebuild shaders and compare reflection data
        run: |
          QSB="$(python -c 'import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), "qsb"))')"
          for f in config/quickshell/aether-shell/graphics/shaders/*.frag; do
            "$QSB" --glsl "300 es,150" -o /tmp/check.qsb "$f"
            "$QSB" -d /tmp/check.qsb > /tmp/new.txt
            "$QSB" -d "$f.qsb" > /tmp/old.txt
            diff -q /tmp/new.txt /tmp/old.txt || { echo "::error::$f.qsb is stale: run scripts/build-shaders.sh-style rebuild with Qt 6.7 qsb"; exit 1; }
          done

  fedora-preflight:
    # Real Fedora: DNF5, real repositories. Runs the read-only preflight and
    # the dry run as a normal user (the installer refuses root).
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - run: dnf -y install git python3 sudo shadow-utils findutils util-linux
      - uses: actions/checkout@v4
      - name: Create an unprivileged user
        run: useradd -m tester && chown -R tester "$GITHUB_WORKSPACE"
      - name: install.sh --check (real package availability via dnf repoquery)
        run: su tester -c "cd '$GITHUB_WORKSPACE' && ./install.sh --check --mode complete" || true
      - name: install.sh --dry-run
        run: su tester -c "cd '$GITHUB_WORKSPACE' && ./install.sh --dry-run --mode recommended"
      - name: aether CLI on Fedora
        run: su tester -c "cd '$GITHUB_WORKSPACE' && bash scripts/bin/aether config validate && bash scripts/bin/aether capabilities && bash scripts/bin/aether security"

  # Explicitly NOT run in CI: anything needing a live Quickshell + Hyprland
  # session (layer-shell surfaces, Hyprland IPC, PipeWire, PAM, GPUs).
  # Listed here so it's visible in the workflow file, not silently absent.
