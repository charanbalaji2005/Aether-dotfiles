name: Release

# Push a tag like v1.0.0-rc.1 or v1.0.0. The full test suite runs first; the
# release gets a source tarball with a SHA-256 checksum and the matching
# CHANGELOG section. Pre-release tags (containing "-") are marked as such.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import sys; sys.path.insert(0, "lib"); import aether; print(aether.__version__)')"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag != lib/aether __version__ $ver"; exit 1; }
      - name: Build tarball
        run: bash packaging/tarball/build-tarball.sh "${GITHUB_REF_NAME#v}"
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="## $ver" 'index($0, v) == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "AetherOS ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags
