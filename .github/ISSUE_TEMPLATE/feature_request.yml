name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: "What would you like to do that you can't today?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: "How could AetherOS help?" }
  - type: checkboxes
    id: principles
    attributes:
      label: AetherOS principles
      options:
        - label: It works with real system data (nothing simulated) and degrades gracefully when unavailable.
        - label: It doesn't need root at runtime or weaken SELinux/firewall/Secure Boot.
