# ULTRON RECOVERY — defaults. Override any of these in
# ~/.config/ultron-recovery/recovery.conf (same format, KEY=value).
# Only the keys below are read; anything else is ignored.

# Mode when none is given on the command line: safe | standard | full
MODE=standard

# Automatic backups (taken before every change) to keep; manual ones are kept.
KEEP_BACKUPS=20

# The dotfiles repository used as the known-good release. Empty: found
# automatically (where ULTRON was installed from, or ~/.config/hypr's link).
REPO=

# Colours: auto | never
COLOR=auto
